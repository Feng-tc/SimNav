# ROS1 flat params for ease_planner_node

sub_start_exploration_topic_: /start_exploration
sub_state_estimation_topic_: /Odometry_gazebo
pub_waypoint_topic_: /way_point
pub_exploration_finish_topic_: exploration_finish
pub_exploring_phase_topic_: /exploring_phase

kAutoStart: true
kPhaseArrivalDist: 1.0
kMapClearingDist: 7.5
kUsePhase1Door: true
kMainEntranceDoorId: "main_entrance"
kPhase1Waypoint: [0.0, 2.5, 0.6]

# Waypoint profile: loads config/profiles/<name>.yaml at runtime.
# Override at launch: roslaunch ease_planner ease_planner_indoor.launch waypoint_profile:=corridor_only
kWaypointProfile: "quick_tour"

kElevatorId: "elevator_main"
kElevatorServedFloorCount: 3

# 1F → 2F (TARE Phase4)
kElevator1_1Waypoint: [0.0, 2.5, 0.6]
kElevator1_2Waypoint: [2.3, 2.5, 0.6]
kElevator1_3Waypoint: [0.0, 2.5, 3.2]
kElevator1TargetFloor: 1
kElevator1WaitFloor: 0

# 2F → 3F (TARE Phase7)
kElevator2_1Waypoint: [0.0, 2.5, 3.2]
kElevator2_2Waypoint: [2.3, 2.5, 3.2]
kElevator2_3Waypoint: [0.0, 2.5, 5.8]
kElevator2TargetFloor: 2
kElevator2WaitFloor: 1
